# What `relecteur eval` measures: the engine and the model that review, as the review in CI is to
# use them, and the judge of expected defects. The API keys come from the environment.
effort = "high"
concurrency = 1
language = "French"
include = ["**/*_spec.rb", "**/*.erb"]
exclude = ["db/schema.rb", "db/migrate/**", "Gemfile.lock", "yarn.lock", "swagger/**"]

[model]
url = "https://api.anthropic.com"
name = "claude-opus-5-5"

[judge]
name = "jev"
threshold = 0.5
