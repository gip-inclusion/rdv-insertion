[pr]
title = "fix(cnaf): make sure mobile lines are not overrided by CNAF landlines"
description = '''
Cette PR fait en sorte de garder le numéro de téléphone le plus adapté lors d'une mise à jour de données CNAF.

Pour cela, je rajoute un nouveau formatage lors de la réception des données CNAF qui va vérifier le type de la ligne introduite par les données CNAF.
Si la ligne est une ligne fixe, alors elle est uniquement gardée dans le cas ou le numéro de téléphone déjà enregistré est vide.

Si la ligne est une ligne mobile, ou si le numéro de téléphone était nil, alors on utilise la nouvelle donnée CNAF.

Fix https://github.com/gip-inclusion/rdv-insertion/issues/2777
'''
