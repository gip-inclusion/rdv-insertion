head = "a88e4ba95f3dee7e8b2087e3b325053d87de1a39"
max_findings = 3

[[expected_defects]]
path = "app/models/user_list_upload/user_row.rb"
line = [317, 322]
concept = "pick_most_relevant_phone_number returns the row's own phone_number when the CNAF file gives no phone number, or gives a landline while the row has a number: cnaf_data, meant to hold what the CNAF file says, then holds the uploaded number for most rows, and these rows are presented as enriched by the CNAF file whenever their matching user has another number."
fix = "https://github.com/gip-inclusion/rdv-insertion/pull/2974/commits/2f932dbcbcaf9a4f334ea1f60619928994915ac5"
