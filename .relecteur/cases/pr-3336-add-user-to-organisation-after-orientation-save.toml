notes = "Adds the user to the orientation's organisation only after the orientation is saved and its overlaps are checked, so that an orientation failing these checks no longer adds the user to the organisation, and updates the specs. Approved by a teammate on 2026-06-23 without any comment: the reviewer should stay silent."
