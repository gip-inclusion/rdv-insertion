[pr]
title = "feat(app): Add invitation_expired follow_up status"
description = '''
## Contexte

Lié à https://www.notion.so/gip-inclusion/Filtre-Distinguer-les-statuts-Invitation-en-attente-de-r-ponse-et-Invitation-sans-r-ponse-d-lai-2935f321b60480898e78e187dc1cfc64

On ajoute un nouveau statut "Invitation sans réponse (délai dépassé)" aux suivis pour pouvoir filtrer directement sur ce statut-là.
Avant ça, pour retrouver les usagers dans cet était il fallait faire un filtre sur le statut "Invitation en attente de réponse" combiné avec un filtre "Intervention nécessaire".

## Implémentation

### Une nouvelle valeur de statut possible

Étant donné que l'on veut rajouter un statut dans les filtres, l'idée est ici de rajouter une nouvelle valeur de `status` possible sur la table `follow_ups` que l'on appelle `invitation_expired`.
Pour qu'un suivi se retrouve dans cet état il faut que:
* il ait été invité sans rdv (ou avec rdv antérieure à la dernière invitation)
* que toutes ses invitations aient expirées

### Un rafraichissement du statut

Pour que l'invitation passe du statut "Invitation en attente de réponse" à "Invitation sans réponse", il faut que le statut soit mis à jour après que les invitations aient expirées. Pour ce faire, on planifie un job qui va s'exécuter une seconde après la dernière invitation envoyée. Cela permet d'avoir un statut à jour sans attendre l'exécution du CRON tous les soirs qui rafraichit les statuts (renommé en `FollowUps::RefreshOutOfDateStatusesJob`).

##### `FollowUps::PlanStatusRefreshJob`
Pour ça, on enqueue un nouveau job `FollowUps::PlanStatusRefreshJob` à chaque fois qu'une invitation est créée/mis à jour. Ce  job va être  responsable de planifier un job quand la dernière invitation a expirée, **mais pas que**:  J'en profite pour que ce mécanisme soit appliqué aussi aux rdvs. Lorsqu'un rdv est créé/mis à jour, on veut que le statut du suivi soit rafraichit juste après que le rdv soit passé. Ainsi le statut du suivi passera directement en `rdv_needs_status_update`.

Du coup on met en place une nouvelle méthode d'instance `follow_up#refresh_status_at` qui va prendre en compte le moment où l'invitation va expirer ou le moment où le rdv aura lieu.

#### `Sidekiq::Scheduler`

Pour ne pas encombrer notre set de jobs planifiés, on veut qu'il n'y ait qu'un job de planifié par suivi (il n'y a besoin de rafraichir qu'au moment de la dernière expiration d'invitation en cours, ou au moment où le rdv aura lieu si un rdv est prévu). Pour ça  j'introduis une nouvelle classe `Sidekiq::Scheduler` qui via une méthode  `schedule_uniq_job` va:
* Chercher  s'il y a un job existant sur la même classe avec les mêmes arguments
* Si oui le reprogrammer à la nouvelle valeur (le `follow_up.refresh_at` dans  notre qu'on passera en argument dans le `FollowUps::PlanStatusRefreshJob`)
* Si non le planifier

### Développements annexes

* Allègement du `FollowUps::RefreshOutOfDateStatusesJob` en itérant sur un set de `follow_ups` plus restreint en preloadant les associations
* Retrait de  toute la logique d'`action_required` qui consistait à chaque fois de vérifier que toutes les invitations avaient expiré est enlevés et qui rend le code beaucoup plus clair

### Points d'attentions

D'une manière générale le code est plus clair, mais il faudra être attention au load que ça va créer sur nos workers (à chaque invitation/rdv on va enqueue un job pour programmer ou reprogrammer un job).
'''
