description = '''
Lié à https://www.notion.so/gip-inclusion/1-3-R-entrant-Cr-ation-modification-bloqu-e-3125f321b60480a585dbd7736e198d5f?source=copy_link

Le ticket contient tout le contexte et toutes les discussions qu'on a eu sur ce sujet.

## Implémentation

J'enlève le service `Users::Validate` qui servait à vérifier et à empêcher la sauvegarde d'usager lorsque l'on détectait un doublon.
Ce service faisait que la mise à jour d'un usager existant bloquait si on détectait un doublon qui correspondait, sans proposer d'alternatives à l'agent. On décide finalement de ne pas bloquer l'agent ici, on travaillera par la suite à un module de détection/réconciliation des doublons.

Je récupère juste le check sur la présence d'un attribut d'identification que contenait le service pour le déplacer dans le model.

N.B: la création d'un nouvel usager n'introduit toujours pas de doublons puisque l'on passe par un upsert qui prend en compte une phase de matching des usagers existants
'''
