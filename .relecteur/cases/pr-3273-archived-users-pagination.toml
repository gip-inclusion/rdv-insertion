[pr]
title = "fix(view): Fix archived users pagination"
description = '''
Lié à https://www.notion.so/gip-inclusion/Bug-Archiv-s-pagination-absente-dans-la-liste-des-bRSA-3335f321b60480a88126faacce30f756?source=copy_link

## Explication

Lorsqu'on récupère les usagers archivés, le `includes(:archives)` puis `order(archives.created_at)` faisait un join qui faisait qu'on loadait plusieurs fois un user lorsque cet usager avait plusieurs `archives`. Du coup on appliquait la pagination (`LIMIT 25`) sur ces usagers dupliqué, et lorsqu'ils étaient rendus à la fin ils étaient dédupliqués
=> A la fin on rendait moins de 25 usagers sur la page, ce qui fait que kaminari ne détectait pas le besoin de pagination

## Correction

J'enlève le `includes(:archives)` pour faire un preload à la place, et lorsque je fais l'ordering je le vais en groupant par `users.id` pour être sûr que le filtre de la pagination se fera sur des usagers distincts.
J'en profite pour améliorer un peu l'ordering et considérer uniquement les archives de l'organisation en question lorsque l'on est au niveau d'une orga.
'''
