[pr]
title = "fix(attachments): Make logos public"
description = '''
Lié à https://www.notion.so/gip-inclusion/Bug-Les-logos-des-d-partements-ne-s-affichent-pas-toujours-dans-les-mail-2e85f321b60480a59948e0cef9cca366

## Problème

Lorsque l'on génère l'url que l'on met dans les emails pour les logos des département et des organisations, on appelle `organisation.logo.url` et `department.logo.url` dans les mailers.
Or notre bucket scaleway étant privé, cela va généré des url signés qui expirent ! Ce qui fait qu'au bout d'un certain temps (probablement très court) les logos ne s'affichaient plus 😬

## Solution

Pour remédier à ça, il fallait trouver une solution qui nous permettent de rendre publiques les logos des départements et des organisations qui ne sont pas des données confidentielles. Il faut aussi que ces logos apparaissent bien dans les mails déjà envoyés !
Pour se faire, on créer un nouveau service scaleway `scaleway_public` qui, s'il est utilisé, store les attachments de manière publique. On utilise ce service pour storer les logos des départements et des orgas.
On fait également un script pour changer les ACL des logos des départements et des orgas et les basculer sur ce service.

## Implémentation

Cette PR peut se lire commit par commit. Elle contient:
* L'ajout d'un service `scaleway_public` pour les logos (même bucket, ACL public-read)
* L'ajout d'une option `publicly_accessible` au concern `has_attached_image`
* Refacto de `has_attached_image` pour améliorer la lisibilité (extraction en méthodes privées)
* Ajout d'une tâche rake `make_logos_public` pour migrer les logos existants

En parallèle j'en ai profité pour mettre à jour le `CLAUDE.md` et pour supprimer un script qui n'est plus utilisé.
'''
