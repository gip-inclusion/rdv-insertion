[pr]
title = "tech(matomo): regroup url without ids in Matomo analytics"
description = '''
Lié à : https://www.notion.so/gip-inclusion/Matomo-Regrouper-les-urls-par-route-28d5f321b6048098bc64c5c63c80b96d

## Problème

RDV-Insertion envoie 8-10x plus d'URLs distinctes à Matomo que les autres produits du GIP à cause des IDs non masqués dans les URLs (/organisations/1/users/62, /organisations/2/users/63, etc.).
Cela surcharge les logs en plus de rendre Matomo difficilement utilisable pour rdv-insertion.

## Réécriture des URLs en patterns de routes avant envoi à Matomo :
- `/organisations/123/users/456` → `/organisations/:organisation_id/users/:id`
- `/user_list_uploads/abc-def-123` → `/user_list_uploads/:user_list_upload_id`
- etc.

## Implémentation

**Approche Rails + JavaScript** :
- Helper Rails qui utilise le router natif pour extraire le pattern de route
- Stockage de l'URL masquée dans un cookie `matomo_page_url` via `before_action`
- Contrôleur Stimulus qui lit le cookie (js-cookie) et l'envoie à Matomo via `customPageUrl`
- Tracking des navigations Turbo avec `turbo:load` (pas tracké avant)
- Feature tests pour vérifier le masquage et les navigations Turbo

 ## ⚠️ Action requise côté Matomo après merge et déploiement en production

Publier la version du container Tag Manager nommée "rewrited ids in CustomPageUrl" qui est déjà prête.
Cette version configure Matomo pour utiliser la variable `customPageUrl` du data layer au lieu de l'URL brute par défaut.
Sans cette publication, le code ne servira à rien (les URLs resteront comme actuellement dans Matomo).
'''
