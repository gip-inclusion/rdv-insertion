name: Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  relecteur:
    name: Relecteur
    # Pull requests of bots are never reviewed. Those of forks get no secret: a comment of the
    # team reviews them. On a comment, the action reviews only when its author can push to the
    # repository.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft
        && github.event.pull_request.user.type != 'Bot'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && github.event.issue.state == 'open' && github.event.issue.user.type != 'Bot'
        && github.event.comment.user.type != 'Bot'
        && contains(github.event.comment.body, '@relecteur'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: relecteur-${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: gip-inclusion/relecteur@d8689e404aa2f258d12f20fb09c78510dd6a60af
        with:
          api_key: ${{ secrets.RELECTEUR_API_KEY }}
