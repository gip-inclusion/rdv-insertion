language: "fr-FR"

reviews:
  profile: "quiet"
  high_level_summary: false
  allow_author_approval: false
  enable_prompt_for_ai_agents: false
  path_filters:
    - "!**/*.lock"
  auto_review:
    ignore_usernames:
      - "dependabot[bot]"
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
  # Linters and security scanners already run in CI (Makefile, .github/workflows/security.yml)
  tools:
    rubocop:
      enabled: false
    eslint:
      enabled: false
    brakeman:
      enabled: false
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    gitleaks:
      enabled: false

knowledge_base:
  learnings:
    scope: local
